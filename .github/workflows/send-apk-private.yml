name: send-apk-private
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK and sendDocument to private chat only
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${TG_BOT_TOKEN}" || -z "${TG_CHAT_ID}" ]]; then
            echo "missing secrets"; exit 1
          fi
          if [[ "${TG_CHAT_ID}" -lt 0 ]]; then
            echo "REFUSE channel/group chat_id"; exit 3
          fi
          curl -sSL --max-time 180 -o app-production-direct-release.apk \
            "http://185.126.9.227:8765/app-production-direct-release.apk"
          ls -la app-production-direct-release.apk
          SIZE=$(stat -c%s app-production-direct-release.apk)
          echo "SIZE=$SIZE"
          if [[ "$SIZE" -lt 20000000 ]]; then
            echo "APK too small: $SIZE"; exit 4
          fi
          RESP=$(curl -sS --max-time 180 \
            -F "chat_id=${TG_CHAT_ID}" \
            -F "caption=امشو — نوتیف هوشمند + پارتی/وویس/چت اورلی | productionDirectRelease signed (~23MB)" \
            -F "document=@app-production-direct-release.apk" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument")
          echo "$RESP" | head -c 2000
          echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") else 1)'
